[build-system]
requires = ["setuptools>=61", "wheel", "attrs>=19.2", "PyYAML>=3.0", "six"]
build-backend = "setuptools.build_meta"

[project]
name = "pystalk"
description = "An extremely simple Python client for beanstalkd"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.6, <4"
license = { file = "LICENSE.txt" }
authors = [{ name = "EasyPost", email = "oss@easypost.com" }]
dependencies = [
    "PyYAML>=3.0",
    "attrs>=19.2",
    "six",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "License :: OSI Approved :: ISC License (ISCL)",
]
[project.optional-dependencies]
dev = [
    "flake8",
    "mock",
    "mypy==0.971",
    "pytest==7.*",
    "pytest-cov==3.*",
    "pytest-mock==3.*",
    "types-PyYAML",
    "types-six",
]
docs = [
    "PyYAML>=3.0",
    "sphinx",
    "sphinx-autobuild",
]

[project.urls]
Source = "https://github.com/easypost/pystalk"

[tool.setuptools.dynamic]
version = { attr = "pystalk.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
