name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # TODO: Ubuntu 26 will require modernizing all dependencies because it drops python 3.9.
    # Keep every workflow, including this 3.14 publish job, on 24.04 so ubuntu-latest cannot move it first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build package
        run: just install build
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Upload assets to release
        uses: AButler/upload-release-assets@v3.0.1
        with:
          files: 'dist/*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}